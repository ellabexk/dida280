<h1 class="Base head_one">Fire and Ice</h1>
<h1 class="Base head_one Heading_3"><em>Robert Frost</em></h1>
<p class="Base Body">Some say the world will end in fire,</p>
<p class="Base Body">Some say in ice.</p>
<p class="Base Body">From what I’ve tasted of desire</p>
<p class="Base Body">I hold with those who favor fire.</p>
<p class="Base Body">But if it had to perish twice,</p>
<p class="Base Body">I think I know enough of hate</p>
<p class="Base Body">To say that for destruction ice</p>
<p class="Base Body">Is also great</p>
<p class="Base Body">And would suffice.</p>
