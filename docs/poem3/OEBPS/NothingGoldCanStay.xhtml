<h1 class="Base head_one">Nothing Gold Can Stay</h1>
<h1 class="Base head_one Heading_3"><em>Robert Frost</em></h1>
<p class="Base Body">Nature’s first green is gold,</p>
<p class="Base Body">Her hardest hue to hold.</p>
<p class="Base Body">Her early leaf’s a flower;</p>
<p class="Base Body">But only so an hour.</p>
<p class="Base Body">Then leaf subsides to leaf.</p>
<p class="Base Body">So Eden sank to grief,</p>
<p class="Base Body">So dawn goes down to day.</p>
<p class="Base Body">Nothing gold can stay.</p>
